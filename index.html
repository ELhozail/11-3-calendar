<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6f5bd3">
  <title>י״א 3 | פיזיקה • כימיה • ביולוגיה</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">

    <header class="hero">
      <div class="hero-art left-art" aria-hidden="true">
        <svg viewBox="0 0 220 190" class="dna-svg">
          <path d="M25 10c65 38 65 94 130 132" fill="none" stroke="#6d83d7" stroke-width="7" stroke-linecap="round"/>
          <path d="M60 0c-60 42-60 105 18 160" fill="none" stroke="#89a0ef" stroke-width="7" stroke-linecap="round"/>
          <g stroke="#4863b7" stroke-width="4">
            <line x1="52" y1="25" x2="18" y2="46"/><line x1="68" y1="48" x2="26" y2="72"/>
            <line x1="83" y1="74" x2="39" y2="99"/><line x1="102" y1="103" x2="58" y2="127"/>
          </g>
        </svg>
        <div class="book-stack">
          <div class="book pink">PHYSICS</div>
          <div class="book blue">CHEMISTRY</div>
          <div class="book green">BIOLOGY</div>
        </div>
      </div>

      <div class="hero-center">
        <div class="eyebrow">תיכון אלנג׳אח</div>
        <h1>י״א 3</h1>
        <div class="subjects">
          <span class="bio">ביולוגיה</span>
          <b>•</b>
          <span class="chem">כימיה</span>
          <b>•</b>
          <span class="phys">פיזיקה</span>
        </div>
        <div class="teacher-pill">👤 מחנך הכיתה</div>
        <div class="teacher-name">عبد الحليم الهزيل</div>
      </div>

      <div class="hero-art right-art" aria-hidden="true">
        <svg viewBox="0 0 240 190" class="atom-svg">
          <g transform="translate(120 76)" fill="none" stroke="#5b67a8" stroke-width="3">
            <ellipse rx="70" ry="28"/><ellipse rx="70" ry="28" transform="rotate(60)"/><ellipse rx="70" ry="28" transform="rotate(120)"/>
          </g>
          <circle cx="120" cy="76" r="11" fill="#f08b5f"/>
          <circle cx="185" cy="78" r="5" fill="#f39d5b"/>
          <circle cx="91" cy="18" r="5" fill="#6ba4df"/>
          <circle cx="82" cy="130" r="5" fill="#7dc79c"/>
        </svg>
        <div class="test-tubes">
          <span></span><span></span><span></span>
        </div>
      </div>
    </header>

    <nav class="quick-actions">
      <button id="shareSite" class="qa whatsapp"><span>☏</span>שיתוף</button>
      <button id="announcementsBtn" class="qa purple"><span>📣</span>הודעות כיתה</button>
      <button id="yearBtn" class="qa orange"><span>🗓️</span>לוח שנתי</button>
      <button id="nextBtn" class="qa sky"><span>📅</span>האירוע הבא</button>
      <label class="qa search-box"><span>⌕</span><input id="search" placeholder="חיפוש"></label>
    </nav>

    <section class="dashboard-grid">
      <article class="panel next-panel">
        <div class="panel-title"><span>🔔</span> האירוע הבא</div>
        <div class="next-event">
          <h2 id="nextTitle">טוען…</h2>
          <div id="nextDate" class="date-line"></div>
          <div class="days-left">
            <span>נותרו עוד</span>
            <strong id="countdown">—</strong>
            <span>ימים</span>
          </div>
        </div>
      </article>

      <article class="panel">
        <div class="panel-title"><span>🔖</span> קטגוריות</div>
        <div class="category-list">
          <button data-filter="exam"><i class="dot exam"></i>מבחנים</button>
          <button data-filter="magen"><i class="dot magen"></i>מגן</button>
          <button data-filter="bagrut"><i class="dot bagrut"></i>בגרות</button>
          <button data-filter="holiday"><i class="dot holiday"></i>חופשות ומועדים</button>
          <button data-filter="activity"><i class="dot activity"></i>פעילויות וטיולים</button>
          <button data-filter="parents"><i class="dot parents"></i>הורים, ציונים ותעודות</button>
        </div>
      </article>

      <article class="panel">
        <div class="panel-title"><span>⏳</span> סינון</div>
        <div class="switch-list">
          <label><span>הצג הכול</span><input type="radio" name="filter" value="all" checked><i></i></label>
          <label><span>מבחנים</span><input type="radio" name="filter" value="exam"><i></i></label>
          <label><span>מגן</span><input type="radio" name="filter" value="magen"><i></i></label>
          <label><span>בגרות</span><input type="radio" name="filter" value="bagrut"><i></i></label>
          <label><span>חופשות ומועדים</span><input type="radio" name="filter" value="holiday"><i></i></label>
          <label><span>פעילויות וטיולים</span><input type="radio" name="filter" value="activity"><i></i></label>
          <label><span>הורים, ציונים ותעודות</span><input type="radio" name="filter" value="parents"><i></i></label>
        </div>
      </article>
    </section>

    <section class="calendar-card" id="calendarCard">
      <div class="calendar-head">
        <div class="month-controls">
          <button id="prevMonth">‹ הקודם</button>
          <button id="nextMonth">הבא ›</button>
        </div>
        <h2 id="monthTitle"></h2>
        <button id="todayBtn" class="today-btn">היום</button>
      </div>

      <div class="weekday-row">
        <span>ראשון</span><span>שני</span><span>שלישי</span><span>רביעי</span><span>חמישי</span><span>שישי</span><span>שבת</span>
      </div>
      <div id="monthGrid" class="month-grid"></div>
    </section>

    <section class="legend-card">
      <div class="school-bag" aria-hidden="true">🎒📚✏️</div>
      <div class="legend-title">🏷️ מקרא צבעים</div>
      <div class="legend-items">
        <span><i class="dot exam"></i>מבחנים</span>
        <span><i class="dot magen"></i>מגן</span>
        <span><i class="dot bagrut"></i>בגרות</span>
        <span><i class="dot holiday"></i>חופשות ומועדים</span>
        <span><i class="dot activity"></i>פעילויות וטיולים</span>
        <span><i class="dot parents"></i>הורים, ציונים ותעודות</span>
      </div>
    </section>

    <section class="events-drawer" id="eventsDrawer">
      <div class="drawer-head">
        <h3>לוח שנתי</h3>
        <button id="closeDrawer">×</button>
      </div>
      <div id="yearList"></div>
    </section>

  </div>

  <div class="modal hidden" id="modal">
    <div class="modal-card">
      <button class="close" id="closeModal">×</button>
      <span id="modalType" class="modal-type"></span>
      <h3 id="modalTitle"></h3>
      <p id="modalDate"></p>
      <button id="shareEvent" class="share-event">שיתוף ב-WhatsApp</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
